*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(135deg,#fff1d0,#ffe2ea 55%,#f2e3ff);color:#3c2454}.app{max-width:1100px;margin:auto;padding:10px}.top{display:flex;gap:8px;align-items:center}.brand{flex:1;text-align:center;background:#fff5d9;border:2px solid #e7a82f;border-radius:22px;padding:7px}.brand h1{margin:0;color:#9b235d;font-size:30px}.brand p{margin:0;font-weight:900}.top button,.action,.card,.small,.dialog button{border:0;border-radius:18px;padding:11px;font-weight:1000;box-shadow:0 5px 15px #54202b20}.audio{background:#ffd66f}.parent{background:#ff6e91;color:#fff}.stars{background:#ffd66f}.layout{display:grid;grid-template-columns:150px 1fr;gap:10px;margin-top:10px}.side{display:flex;flex-direction:column;gap:8px}.side button{border:0;border-radius:18px;background:#fff;padding:13px 5px;font-weight:1000;color:#6c1f60}.main{background:#fffaf0;border:2px solid #e9bc58;border-radius:28px;padding:12px}.hero{position:relative;border-radius:22px;overflow:hidden}
.pujaFX{position:absolute;inset:0;z-index:5;pointer-events:none}
.pujaFlame{position:absolute;left:50%;bottom:17%;transform:translateX(-50%) scale(.2);font-size:54px;opacity:0;filter:drop-shadow(0 0 12px #ff9d00);transition:transform .35s,opacity .35s}
.hero.diyaOn .pujaFlame{opacity:1;transform:translateX(-50%) scale(1);animation:flameGlow .75s ease-in-out infinite alternate}
@keyframes flameGlow{to{transform:translateX(-50%) scale(1.12);filter:drop-shadow(0 0 22px #ffb000)}}
.templeBellFX{position:absolute;right:13%;top:12%;font-size:54px;opacity:0}
.templeBellFX.ringing{opacity:1;animation:ringBell .75s ease-in-out 3}

.flowerFX{position:absolute;left:22%;bottom:18%;font-size:48px;opacity:0}
.flowerFX.offer{animation:offerFlower 1.1s ease-out forwards}

.prasadFX{position:absolute;right:20%;bottom:17%;font-size:50px;opacity:0}
.prasadFX.offer{animation:offerPrasad 1.1s ease-out forwards}

s:20px}.dialog h2{font-size:30px}.dialog p{font-size:20px;font-weight:900;line-height:1.45}.dialog button{background:#7c2d9c;color:white;margin:4px}.reward{position:fixed;inset:0;display:none;align-items:center;justify-content:center;font-size:65px;background:#fff4c999;z-index:50;pointer-events:none}.reward.show{display:flex;animation:r 1.1s forwards}@keyframes r{0%{opacity:0}20%{opacity:1}100%{opacity:0}}@media(max-width:720px){.layout{grid-template-columns:1fr}.side{display:grid;grid-template-columns:repeat(4,1fr)}.side button{font-size:12px;padding:9px 2px}.hero img{height:330px}.cards{grid-template-columns:repeat(2,1fr)}.card img{height:155px}.actions{grid-template-columns:repeat(3,1fr)}.parent{display:none}.two{grid-template-columns:1fr}}

function indianVoice(){
  if(!("speechSynthesis" in window)) return null;
  const voices=speechSynthesis.getVoices();
  return voices.find(v=>/^en-IN/i.test(v.lang)) ||
         voices.find(v=>/India/i.test(v.name)) || null;
}

function speak(text){
  if(!("speechSynthesis" in window)){

    u.volume=1;
    speechSynthesis.speak(u);
  }catch(e){}
}

    const o=c.createOscillator(), g=c.createGain();
    o.type="sine";
    o.frequency.value=f;
    const t=c.currentTime+i*.08;
    g.gain.setValueAtTime(.0001,t);
    g.gain.exponentialRampToValueAtTime(.09,t+.025);
    g.gain.exponentialRampToValueAtTime(.0001,t+.55);
    o.connect(g); g.connect(c.destination);
    o.start(t); o.stop(t+.6);
  });
}

function bellSound(){
  const c=getAudio();
  if(!c) return;
  [880,1175,1568].forEach((f,i)=>{
    const o=c.createOscillator(), g=c.createGain();
    o.type="sine"; o.frequency.value=f;
    const t=c.currentTime;
    g.gain.setValueAtTime(.0001,t);
    g.gain.exponentialRampToValueAtTime(.12/(i+1),t+.015);
    g.gain.exponentialRampToValueAtTime(.0001,t+1.0);
    o.connect(g); g.connect(c.destination);
    o.start(t); o.stop(t+1.05);
  });
}

function reward(){
  const r=document.getElementById("reward");
  r.classList.remove("show");
  void r.offsetWidth;
  r.classList.add("show");
  stars++;
  document.querySelector(".stars").textContent="⭐ "+stars;
}

function act(text){
  document.querySelector(".heroText").innerHTML="🌸 "+text+" 🌸";
  const hero=document.getElementById("hero");
  const fx=document.getElementById("pujaFX");

  if(!fx){
    speak(text);
    reward();
    return;
  }

  fx.innerHTML="";
  if(text.includes("Light the diya")){
    fx.innerHTML='<div class="pujaFlame">🔥</div>';
    hero.classList.add("diyaOn");
    chime();
  }else if(text.includes("Offer a flower")){
    fx.innerHTML='<div class="flowerFX offer">🌸</div>';
    chime();
  }else if(text.includes("Ring the bell")){
    fx.innerHTML='<div class="templeBellFX ringing">🔔</div>';
    bellSound();
  }else if(text.includes("Offer prasad")){
    fx.innerHTML='<div class="prasadFX offer">🍌</div>';
    chime();
  }else{
    chime();
  }

  speak(text);
  reward();
}

function openModal(title,img,text){
  document.getElementById("mtitle").textContent=title;
  document.getElementById("mimg").src=img;
  document.getElementById("mtext").textContent=text;
  modalText=text;
  const area=document.getElementById("songArea");
  const song=songs[title];
  if(song){
    if(song.id){
      area.innerHTML='<div class="songBox"><b>🎵 '+song.title+'</b><iframe src="https://www.youtube.com/embed/'+song.id+'?rel=0" title="'+song.title+'" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe></div>';
    }else{
      area.innerHTML='<div class="songBox"><b>🎵 '+song.title+'</b><br><a class="songBtn" target="_blank" rel="noopener" href="'+song.search+'">▶ Play devotional song</a></div>';
    }
  }else{
    area.innerHTML="";
  }
  document.getElementById("modal").classList.add("show");
}

function closeModal(){
  document.getElementById("modal").classList.remove("show");
  modalText="";
}

function hearModal(){
  speak(modalText);
}

function go(id){
  const el=document.getElementById(id);
  if(el) el.scrollIntoView({behavior:"smooth",block:"start"});
}

function topPage(){

}
