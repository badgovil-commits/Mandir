let ac=null,habitIndex=0;
function voice(){if(!('speechSynthesis'in window))return null;let v=speechSynthesis.getVoices();return v.find(x=>/^en-IN/i.test(x.lang))||v.find(x=>/India/i.test(x.name))||null}
function tone(){const C=window.AudioContext||window.webkitAudioContext;if(!C)return;if(!ac)ac=new C();if(ac.state==='suspended')ac.resume();let o=ac.createOscillator(),g=ac.createGain();o.frequency.value=650;g.gain.setValueAtTime(.0001,ac.currentTime);g.gain.exponentialRampToValueAtTime(.1,ac.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+.3);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.35)}
function speak(t){tone();if(!('speechSynthesis'in window))return;try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t),v=voice();if(v)u.voice=v;u.lang=v?v.lang:'en-IN';u.rate=.58;u.pitch=1.08;u.volume=1;speechSynthesis.speak(u)}catch(e){}}
function build(){let g=document.getElementById('catGrid');CATS.forEach(c=>{let b=document.createElement('button');b.className='tile';let first=DATA[c][0];b.innerHTML='<div class="tileImg"><img src="'+first.img+'"></div><b>'+c+'</b>';b.onclick=()=>openCat(c);g.appendChild(b)});let d=document.getElementById('deities');deity.forEach((x,i)=>{let b=document.createElement('button');b.className='card';b.innerHTML='<img src="'+x.img+'"><div class="cardName">'+x.name+' 🔊</div>';b.onclick=()=>openDeity(i);d.appendChild(b)})}
function openCat(c){hideAll();document.getElementById('page').classList.add('show');document.getElementById('picon').textContent=DATA[c][0].emoji;document.getElementById('ptitle').textContent=c;let box=document.getElementById('cards');box.innerHTML='';DATA[c].forEach(x=>{let b=document.createElement('button');b.className='card';b.innerHTML='<img src="'+x.img+'"><div class="cardName">'+x.name+' 🔊</div>';b.onclick=()=>{speak(x.name);document.getElementById('status').textContent='⭐ Great job! '+x.name};box.appendChild(b)})}
function openDeity(i){hideAll();let x=deity[i];document.getElementById('modal').classList.add('show');document.getElementById('mi').src=x.img;document.getElementById('mt').textContent=x.name;document.getElementById('mx').textContent=x.text;document.getElementById('song').innerHTML='<a class="play" target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query='+encodeURIComponent(x.name+' devotional song kids')+'">🎵 Play Devotional Song</a>';speak(x.text)}
function openMandir(){hideAll();document.getElementById('mandir').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function hideAll(){document.getElementById('home').style.display='none';document.querySelectorAll('.page').forEach(x=>x.classList.remove('show'));closeModal()}
function home(){closeModal();document.querySelectorAll('.page').forEach(x=>x.classList.remove('show'));document.getElementById('home').style.display='block'}
const Q=[['Which one is an elephant?','Elephant',['Dog','Elephant','Cat','Rabbit']],['Which one is a fruit?','Apple',['Apple','Car','Lion','Bus']],['Which one is red?','Red',['Red','Blue','Green','Yellow']],['Which one is a triangle?','Triangle',['Circle','Triangle','Square','Star']]];
function quiz(){hideAll();document.getElementById('quizPage').classList.add('show');let q=Q[Math.floor(Math.random()*Q.length)];document.getElementById('qtext').textContent=q[0];let b=document.getElementById('qopts');b.innerHTML='';q[2].forEach(x=>{let z=document.createElement('button');z.className='qopt';z.innerHTML='<div style="font-size:58px">'+({'Elephant':'🐘','Dog':'🐶','Cat':'🐱','Rabbit':'🐰','Apple':'🍎','Car':'🚗','Lion':'🦁','Bus':'🚌','Red':'🔴','Blue':'🔵','Green':'🟢','Yellow':'🟡','Circle':'⚪','Triangle':'🔺','Square':'🟦','Star':'⭐'}[x]||'🌈')+'</div>'+x;z.onclick=()=>{if(x===q[1]){speak('Great job! '+x);document.getElementById('qstatus').textContent='🎉 Correct! ⭐'}else{speak('Try again');document.getElementById('qstatus').textContent='💛 Try again'}};b.appendChild(z)})}
function habit(){hideAll();document.getElementById('habitPage').classList.add('show');habitIndex=0;renderHabit()}
function renderHabit(){let x=DATA['Good Habits'][habitIndex];document.getElementById('habitAnim').textContent=x.emoji;document.getElementById('habitText').textContent=x.name;document.getElementById('habitDesc').textContent='Let’s '+x.name.toLowerCase()+' every day!'}
function habitSpeak(){speak(document.getElementById('habitText').textContent+' every day!')}
function nextHabit(){habitIndex=(habitIndex+1)%DATA['Good Habits'].length;renderHabit();habitSpeak()}
build();
